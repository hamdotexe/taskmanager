spring.application.name=taskmanager
# a desktop app: no web server
spring.main.web-application-type=none
spring.main.banner-mode=off

# taskmanager.data-folder is %LOCALAPPDATA%\TaskManager, set at start (see AppDataFolder); a test sets a folder of its
# own. WAL lets a second copy of the app read while this one writes, and the busy timeout has a write wait up to 5
# seconds for the other copy's to finish instead of failing at once.
spring.datasource.url=jdbc:sqlite:${taskmanager.data-folder}/taskmanager.db?journal_mode=WAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite takes one writer at a time; one connection queues this copy's writes instead of failing them as busy
spring.datasource.hikari.maximum-pool-size=1

# the schema is Flyway's (src/main/resources/db/migration); Hibernate only checks the entities match it
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
